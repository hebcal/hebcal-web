; Deliberately empty. vitest.config.js points HEBCAL_INI_PATH here so the suite
; starts from a known-empty config on every machine, rather than reading the
; developer's own ./hebcal-dot-com.ini.
;
; Do not add credentials or feature flags here. A test that needs a feature
; turned on sets the keys on app.context.iniConfig in its own beforeAll/beforeEach
; and clears them again -- that keeps the precondition visible in the test that
; depends on it.
